# velora-api-test.aipassly.com — Velora 测试 API
# 反代 → 127.0.0.1:4001（PM2: velora-api-test）
#
# 安装:
#   sudo cp scripts/nginx/velora-api-test.aipassly.com.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/velora-api-test.aipassly.com.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d velora-api-test.aipassly.com
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name velora-api-test.aipassly.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name velora-api-test.aipassly.com;

    ssl_certificate     /etc/letsencrypt/live/velora-api-test.aipassly.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/velora-api-test.aipassly.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
